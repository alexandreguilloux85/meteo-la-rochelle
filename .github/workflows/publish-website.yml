name: Publish website

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/workflows/publish-website.yml'
  workflow_dispatch:
  repository_dispatch:
    types:
      - arome-cache-updated
      - arome-paquets-cache-updated
      - arome-pi-cache-updated

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare-website:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare website files
        run: |
          mkdir -p site
          cp -R public/. site/

      - name: Assemble latest AROME data
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          restore_branch() {
            local branch="$1"
            local destination="$2"
            mkdir -p "$destination"
            if git fetch --no-tags origin "$branch"; then
              git archive FETCH_HEAD | tar -x -C "$destination" || return 1
              echo "Données restaurées depuis $branch."
              return 0
            fi
            echo "Branche $branch absente : utilisation du dernier jeu publié si disponible."
            return 1
          }

          if restore_branch arome-data "$tmp/arome"; then
            test -s "$tmp/arome/arome-cache.json"
            cp "$tmp/arome/arome-cache.json" site/arome-cache.json
          else
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --max-time 60 \
              "https://alexandreguilloux85.github.io/meteo-la-rochelle/arome-cache.json" \
              --output site/arome-cache.json
          fi

          node -e '
            const fs = require("node:fs");
            const cache = JSON.parse(fs.readFileSync("site/arome-cache.json", "utf8"));
            if (!cache?.modele || !cache?.zone || !Array.isArray(cache.previsions) || cache.previsions.length === 0) {
              throw new Error("Cache AROME absent ou invalide.");
            }

            console.log("Échéances AROME :", cache.previsions.length);
          '

      - name: Include the validated production AROME backups (optional)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          validate_cache() {
            python3 - "$@" <<'PY'
          import gzip
          import json
          import sys
          from pathlib import Path

          filename, source, max_gzip, max_json, count = sys.argv[1:]
          path = Path(filename)
          if not 0 < path.stat().st_size <= int(max_gzip):
              sys.exit("Sauvegarde AROME de taille inattendue.")
          max_json = int(max_json)
          with gzip.open(path, "rb") as compressed:
              raw = compressed.read(max_json + 1)
          if len(raw) > max_json:
              sys.exit("Sauvegarde AROME décompressée trop volumineuse.")
          cache = json.loads(raw)
          if cache.get("source") != source or len(cache.get("previsions", [])) != int(count):
              sys.exit("Source ou échéances de la sauvegarde AROME inattendues.")
          PY
          }

          include_cache() {
            local branch="$1" file="$2"
            shift 2
            if git fetch --no-tags origin "$branch" &&
               git archive FETCH_HEAD "$file" | tar -x -C "$tmp" &&
               validate_cache "$tmp/$file" "$@"; then
              cp "$tmp/$file" "site/$file"
            else
              echo "Sauvegarde de production $file indisponible."
            fi
          }

          include_cache arome-paquets-data arome-paquets-cache.json.gz \
            'AROME 0.025 SP1 GRIB2 ecCodes - Render production' 16777216 47185920 51
          include_cache arome-pi-production-data arome-pi-cache.json.gz \
            'Render production' 524288 1048576 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish-website:
    needs: prepare-website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
