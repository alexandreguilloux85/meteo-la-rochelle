name: Publish website

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/workflows/publish-website.yml'
  workflow_dispatch:
  repository_dispatch:
    types:
      - arome-cache-updated
      - arome-paquets-cache-updated
      - arome-pi-cache-updated

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare-website:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare website files
        run: |
          mkdir -p site
          cp -R public/. site/

      - name: Assemble latest AROME data
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          restore_branch() {
            local branch="$1"
            local destination="$2"
            mkdir -p "$destination"
            if git fetch --no-tags origin "$branch"; then
              git archive FETCH_HEAD | tar -x -C "$destination" || return 1
              echo "Données restaurées depuis $branch."
              return 0
            fi
            echo "Branche $branch absente : utilisation du dernier jeu publié si disponible."
            return 1
          }

          if restore_branch arome-data "$tmp/arome"; then
            test -s "$tmp/arome/arome-cache.json"
            cp "$tmp/arome/arome-cache.json" site/arome-cache.json
          else
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --max-time 60 \
              "https://alexandreguilloux85.github.io/meteo-la-rochelle/arome-cache.json" \
              --output site/arome-cache.json
          fi

          node -e '
            const fs = require("node:fs");
            const cache = JSON.parse(fs.readFileSync("site/arome-cache.json", "utf8"));
            if (!cache?.modele || !cache?.zone || !Array.isArray(cache.previsions) || cache.previsions.length === 0) {
              throw new Error("Cache AROME absent ou invalide.");
            }

            console.log("Échéances AROME :", cache.previsions.length);
          '

      - name: Include last validated AROME GRIB2 cache (optional)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Le fichier GRIB2 ne remplace jamais le cache WCS historique :
          # la page et les API de production continuent de fonctionner comme avant.
          if git fetch --no-tags origin arome-paquets-data; then
            git archive FETCH_HEAD arome-paquets-cache.json.gz | tar -x -C "$tmp"
            test -s "$tmp/arome-paquets-cache.json.gz"
            cp "$tmp/arome-paquets-cache.json.gz" site/arome-paquets-cache.json.gz
            echo "Sauvegarde AROME Paquets incluse : $(du -h site/arome-paquets-cache.json.gz)"
          else
            echo "Pas encore de branche arome-paquets-data : publication du site sans la sauvegarde."
            # Sauvegarde conservée si déjà publiée, même si la branche est inaccessible.
            curl --fail --silent --show-error --max-time 30 \
              "https://alexandreguilloux85.github.io/meteo-la-rochelle/arome-paquets-cache.json.gz" \
              --output "$tmp/arome-paquets-cache.json.gz" || true
            if [ -s "$tmp/arome-paquets-cache.json.gz" ]; then
              cp "$tmp/arome-paquets-cache.json.gz" site/arome-paquets-cache.json.gz
            fi
          fi

      - name: Include last validated AROME-PI test cache (optional)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          file=arome-pi-cache.json.gz
          if git fetch --no-tags origin arome-pi-data &&
             git archive FETCH_HEAD "$file" | tar -x -C "$tmp" &&
             [ -s "$tmp/$file" ] &&
             [ "$(wc -c < "$tmp/$file")" -le 524288 ] && gzip -t "$tmp/$file"; then
            cp "$tmp/$file" "site/$file"
          elif curl --fail --silent --show-error --max-time 30 --max-filesize 524288 \
            "https://alexandreguilloux85.github.io/meteo-la-rochelle/$file" \
            --output "$tmp/previous.gz" && gzip -t "$tmp/previous.gz"; then
            cp "$tmp/previous.gz" "site/$file"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish-website:
    needs: prepare-website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
