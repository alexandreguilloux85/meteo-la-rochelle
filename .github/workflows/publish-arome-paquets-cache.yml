name: Save AROME Paquets cache

on:
  repository_dispatch:
    types:
      - arome-paquets-cache-ready
      - arome-paquets-production-cache-ready
  workflow_dispatch:
    inputs:
      source:
        description: Render environment
        type: choice
        options:
          - production
          - test
        default: production

permissions:
  contents: write

jobs:
  save-cache:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: arome-paquets-data-${{ inputs.source || (github.event.action == 'arome-paquets-cache-ready' && 'test' || 'production') }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CACHE_SOURCE: ${{ inputs.source || (github.event.action == 'arome-paquets-cache-ready' && 'test' || 'production') }}
    steps:
      - name: Checkout main (for authenticated push)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fetch and validate the latest GRIB2 cache from the configured Render service
        id: cache
        env:
          EXPECTED_SHA256: ${{ github.event.client_payload.sha256 }}
          EXPECTED_MODEL: ${{ github.event.client_payload.modele }}
        run: |
          set -euo pipefail
          case "$CACHE_SOURCE" in
            test)
              render_origin='https://station-meteo-lr-test.onrender.com'
              branch='refs/heads/arome-paquets-test-data'
              export EXPECTED_SOURCE='AROME 0.025 SP1 GRIB2 ecCodes - Render test'
              ;;
            production)
              render_origin='https://station-meteo-lr.onrender.com'
              branch='refs/heads/arome-paquets-data'
              export EXPECTED_SOURCE='AROME 0.025 SP1 GRIB2 ecCodes - Render production'
              ;;
            *) echo "Source AROME Paquets invalide : $CACHE_SOURCE" >&2; exit 1 ;;
          esac

          # Conserver le corps HTTP tel que reçu : certains intermédiaires
          # peuvent le décompresser en JSON malgré son nom .gz.
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 180 --max-filesize 47185920 \
            -H "Accept: application/octet-stream" \
            --dump-header /tmp/arome-paquets-cache.headers \
            "${render_origin}/api/arome/paquets/test/cache" \
            --output /tmp/arome-paquets-cache.download

          lease=''
          published_ref="$(git ls-remote --heads origin "$branch")"
          if [ -n "$published_ref" ]; then
            git fetch --no-tags origin "$branch"
            lease="$(git rev-parse FETCH_HEAD)"
            git show "$lease:arome-paquets-cache.json.gz" > /tmp/arome-paquets-cache-previous.json.gz
          fi
          printf 'branch=%s\nlease=%s\n' "$branch" "$lease" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import gzip
          import hashlib
          import io
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("/tmp/arome-paquets-cache.download")
          destination = Path("/tmp/arome-paquets-cache.json.gz")
          body = source.read_bytes()
          size = len(body)
          print("Réponse Render téléchargée :", size, "octets ; premiers octets :", body[:12].hex(), flush=True)
          if not (1_000 < size <= 45 * 1024 * 1024):
              raise ValueError(
                  f"Réponse Render de taille inattendue ({size} octets). "
                  "Vérifier le cache disponible, la réponse HTTP et le déploiement du service Render configuré."
              )

          expected_sha = os.getenv("EXPECTED_SHA256", "")
          expected_model = os.getenv("EXPECTED_MODEL", "")
          if os.environ["GITHUB_EVENT_NAME"] == "repository_dispatch" and not (expected_model and expected_sha):
              raise ValueError("Le dispatch AROME Paquets doit fournir le modèle et le SHA256.")
          if body.startswith(b"\x1f\x8b"):
              print("Format reçu : GZIP natif", flush=True)
              sha = hashlib.sha256(body).hexdigest()
              if expected_sha and sha != expected_sha:
                  raise ValueError("Cache remplacé sur Render entre la demande et la sauvegarde : SHA différent")
              with gzip.GzipFile(fileobj=io.BytesIO(body)) as compressed:
                  raw = compressed.read(45 * 1024 * 1024 + 1)
              if len(raw) > 45 * 1024 * 1024:
                  raise ValueError("JSON décompressé trop volumineux")
              destination.write_bytes(body)
          elif body.lstrip().startswith(b"{"):
              print("Format reçu : JSON déjà décompressé ; recompresser pour Pages", flush=True)
              raw = body
              # La somme SHA256 annoncée par Render concerne son gzip original,
              # pas le JSON après décompression par un proxy HTTP.
              if expected_sha:
                  print("SHA256 du gzip source non comparable au JSON décompressé")
              destination.write_bytes(gzip.compress(raw, compresslevel=6, mtime=0))
          else:
              raise ValueError(
                  "La réponse HTTP n'est ni un gzip ni un JSON AROME : "
                  + repr(body[:150])
              )

          cache = json.loads(raw)
          expected_source = os.environ["EXPECTED_SOURCE"]
          if cache.get("source") != expected_source:
              raise ValueError("Source du cache AROME Paquets inattendue.")
          if expected_model and cache.get("modele") != expected_model:
              raise ValueError(
                  f"Modèle AROME différent du modèle annoncé : {cache.get('modele')!r}"
              )
          run = datetime.fromisoformat(cache["modele"].replace("Z", "+00:00"))
          if run > datetime.now(timezone.utc):
              raise ValueError("Date du modèle AROME Paquets dans le futur.")
          previsions = cache.get("previsions", [])
          if len(previsions) != 51:
              raise ValueError(f"Cache AROME incomplet : {len(previsions)} / 51 échéances")
          if {p["seconde"] for p in previsions} != set(range(3600, 52 * 3600, 3600)):
              raise ValueError("Heures manquantes ou dupliquées dans le cache")
          for p in previsions:
              for field in ("U", "V", "RAFALE"):
                  grid = p[field]["grille"]
                  if len(p[field]["valeurs"]) != grid["Ni"] * grid["Nj"]:
                      raise ValueError(f"Grille AROME {field} incomplète à {p['seconde']} s")
          zone = cache.get("zone", {})
          if (zone.get("latMin"), zone.get("latMax"), zone.get("lonMin"), zone.get("lonMax")) != (43.2, 48.3, -5, -0.3):
              raise ValueError("Zone AROME inattendue")
          if not (1_000 < destination.stat().st_size < 16 * 1024 * 1024):
              raise ValueError(f"Cache recompressé de taille inattendue : {destination.stat().st_size} octets")
          previous = Path("/tmp/arome-paquets-cache-previous.json.gz")
          if previous.exists():
              if previous.stat().st_size >= 16 * 1024 * 1024:
                  raise ValueError("Ancienne sauvegarde AROME Paquets trop volumineuse.")
              with gzip.open(previous, "rb") as compressed:
                  previous_raw = compressed.read(45 * 1024 * 1024 + 1)
              if len(previous_raw) > 45 * 1024 * 1024:
                  raise ValueError("Ancienne sauvegarde AROME Paquets décompressée trop volumineuse.")
              old_cache = json.loads(previous_raw)
              if old_cache.get("source") == expected_source:
                  old_run = datetime.fromisoformat(old_cache["modele"].replace("Z", "+00:00"))
                  if old_run > run:
                      raise ValueError("La sauvegarde existante contient déjà un modèle plus récent.")
          print("Paquets AROME vérifiés :", cache["modele"], "51 échéances / 3 variables")
          print("Gzip sauvegardé :", round(destination.stat().st_size / 1048576, 2), "Mo", flush=True)
          PY

      - name: Require complete point forecasts for the production backup
        if: env.CACHE_SOURCE == 'production'
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { gunzipSync } = require('node:zlib');
          const { ajouterMeteoAuxPrevisions } = require('./arome-meteo-point-test');

          function lireCache(gzip) {
            return JSON.parse(gunzipSync(gzip, { maxOutputLength: 45 * 1024 * 1024 }));
          }

          const cache = lireCache(readFileSync('/tmp/arome-paquets-cache.json.gz'));
          const champs = ['T2M_METEO', 'NEBUL_METEO', 'PRECIP_METEO'];
          if (!Number.isInteger(cache.meteo_version) || cache.meteo_version < 2 ||
              !champs.every(champ => cache.champs_meteo?.[champ] === 51)) {
            throw new Error('Cache de production incomplet : 51 grilles par champ météo sont requises.');
          }
          const previsions = cache.previsions.map(({ seconde }) => ({ echeance: `H+${seconde / 3600}` }));
          ajouterMeteoAuxPrevisions(cache, { previsions }, 46.178, -1.193167);
          const incomplete = previsions.find(prevision =>
            ![prevision.temperature, prevision.nebulosite, prevision.precipitation].every(Number.isFinite)
          );
          if (incomplete) {
            throw new Error(`Prévision de production incomplète à La Rochelle : ${incomplete.echeance}.`);
          }

          console.log('Production AROME : 51 échéances météo vérifiées à La Rochelle.');
          NODE

      - name: Replace dedicated data branch with one single commit
        env:
          CACHE_BRANCH: ${{ steps.cache.outputs.branch }}
          CACHE_BRANCH_LEASE: ${{ steps.cache.outputs.lease }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Branche dédiée de données, sans conserver l'historique des fichiers.
          # Aucun push vers main, ni vers Test_fonction ou arome-data.
          git switch --orphan arome-paquets-staging
          git rm -r -f --ignore-unmatch .
          cp /tmp/arome-paquets-cache.json.gz arome-paquets-cache.json.gz
          git add arome-paquets-cache.json.gz
          git commit -m "Dernier cache AROME Paquets GRIB2 validé"
          git push --force-with-lease="$CACHE_BRANCH:$CACHE_BRANCH_LEASE" \
            origin "HEAD:$CACHE_BRANCH"

      - name: Republish site with latest AROME Paquets production backup
        if: env.CACHE_SOURCE == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"arome-paquets-cache-updated"}'
