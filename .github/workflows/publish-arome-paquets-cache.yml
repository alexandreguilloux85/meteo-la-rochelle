name: Save AROME Paquets cache for GitHub Pages

on:
  repository_dispatch:
    types:
      - arome-paquets-cache-ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arome-paquets-data-branch
  cancel-in-progress: false

jobs:
  save-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (for authenticated push)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fetch and validate the latest Render test GRIB2 cache
        env:
          EXPECTED_SHA256: ${{ github.event.client_payload.sha256 }}
          EXPECTED_MODEL: ${{ github.event.client_payload.modele }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --max-time 180 \
            "https://station-meteo-lr-test.onrender.com/api/arome/paquets/test/cache" \
            --output /tmp/arome-paquets-cache.json.gz

          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path

          file = Path("/tmp/arome-paquets-cache.json.gz")
          assert 1_000 < file.stat().st_size < 16 * 1024 * 1024, "Cache GZIP de taille inattendue"
          expected_sha = os.getenv("EXPECTED_SHA256", "")
          sha = hashlib.sha256(file.read_bytes()).hexdigest()
          if expected_sha and sha != expected_sha:
              raise ValueError("Cache remplacé sur Render entre la demande et la sauvegarde : SHA différent")
          with gzip.open(file, "rt", encoding="utf-8") as stream:
              cache = json.load(stream)
          expected_model = os.getenv("EXPECTED_MODEL", "")
          if expected_model and cache.get("modele") != expected_model:
              raise ValueError("Modèle AROME différent du modèle annoncé")
          previsions = cache.get("previsions", [])
          assert len(previsions) == 51, "Le cache ne contient pas exactement 51 échéances"
          assert {p["seconde"] for p in previsions} == set(range(3600, 52*3600, 3600)), "Heures manquantes ou dupliquées"
          for p in previsions:
              for field in ("U", "V", "RAFALE"):
                  grid = p[field]["grille"]
                  assert len(p[field]["valeurs"]) == grid["Ni"] * grid["Nj"], "Grille AROME incomplète"
          assert cache.get("zone", {}).get("latMin") == 43.2
          assert cache.get("zone", {}).get("latMax") == 48.3
          print("Paquets AROME vérifiés :", cache["modele"], "51 échéances / 3 variables")
          print("Gzip:", round(file.stat().st_size / 1048576, 2), "Mo · SHA256:", sha)
          PY

      - name: Replace dedicated data branch with one single commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Branche dédiée de données, sans conserver l'historique des fichiers.
          # Aucun push vers main, ni vers Test_fonction ou arome-data.
          git switch --orphan arome-paquets-staging
          git rm -r -f --ignore-unmatch .
          cp /tmp/arome-paquets-cache.json.gz arome-paquets-cache.json.gz
          git add arome-paquets-cache.json.gz
          git commit -m "Dernier cache AROME Paquets GRIB2 validé"
          git push --force origin HEAD:refs/heads/arome-paquets-data

      - name: Republish site with latest AROME Paquets backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"arome-paquets-cache-updated"}'
