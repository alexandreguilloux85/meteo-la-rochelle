name: Publish AROME cache

on:
  schedule:
    - cron: "15 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Prepare AROME data
        run: mkdir -p data-arome

      - name: Validate Render configuration
        env:
          RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL }}
          RENDER_REFRESH_TOKEN: ${{ secrets.RENDER_REFRESH_TOKEN }}
        run: |
          if [ -z "$RENDER_BASE_URL" ] || [ -z "$RENDER_REFRESH_TOKEN" ]; then
            echo "Configure the RENDER_BASE_URL variable and RENDER_REFRESH_TOKEN secret."
            exit 1
          fi

      - name: Start the scheduled AROME refresh
        env:
          RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL }}
          RENDER_REFRESH_TOKEN: ${{ secrets.RENDER_REFRESH_TOKEN }}
        run: |
          base_url="${RENDER_BASE_URL%/}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $RENDER_REFRESH_TOKEN" \
            "$base_url/api/arome/cache/refresh"

      - name: Wait for the scheduled AROME refresh
        env:
          RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL }}
          RENDER_REFRESH_TOKEN: ${{ secrets.RENDER_REFRESH_TOKEN }}
        run: |
          base_url="${RENDER_BASE_URL%/}"
          max_refresh_attempts=2
          for refresh_attempt in $(seq 1 "$max_refresh_attempts"); do
            for attempt in $(seq 1 340); do
            curl --fail --silent --show-error --retry 2 --retry-all-errors \
              --max-time 30 \
              --header "Authorization: Bearer $RENDER_REFRESH_TOKEN" \
              "$base_url/api/arome/cache/status" \
              --output /tmp/arome-status.json

            status="$(node -e '
              const fs = require("node:fs");
              const result = JSON.parse(fs.readFileSync("/tmp/arome-status.json", "utf8"));
              if (result.erreur) console.error(result.erreur);
              process.stdout.write(result.status || "invalid");
            ')"

            case "$status" in
              complete)
                echo "AROME refresh completed."
                exit 0
                ;;
              failed)
                if [ "$refresh_attempt" -lt "$max_refresh_attempts" ]; then
                  echo "AROME refresh failed; retrying once in 60 seconds."
                  sleep 60
                  curl --fail --silent --show-error --retry 3 --retry-all-errors \
                    --max-time 120 \
                    --request POST \
                    --header "Authorization: Bearer $RENDER_REFRESH_TOKEN" \
                    "$base_url/api/arome/cache/refresh"
                  break
                fi
                echo "AROME refresh failed after $refresh_attempt attempts."
                exit 1
                ;;
              invalid)
                echo "AROME refresh failed with status: $status"
                exit 1
                ;;
              running|idle)
                sleep 15
                ;;
              *)
                echo "Unexpected AROME refresh status: $status"
                exit 1
                ;;
            esac
            done

            if [ "$status" != "failed" ]; then
              echo "Timed out waiting for the AROME refresh."
              exit 1
            fi
          done

          echo "AROME refresh failed after $max_refresh_attempts attempts."
          exit 1

      - name: Download the prepared cache
        env:
          RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL }}
          RENDER_REFRESH_TOKEN: ${{ secrets.RENDER_REFRESH_TOKEN }}
        run: |
          base_url="${RENDER_BASE_URL%/}"
          mkdir -p data-arome
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 120 \
            --header "Authorization: Bearer $RENDER_REFRESH_TOKEN" \
            "$base_url/api/arome/cache/export" \
            --output data-arome/arome-cache.json
          node -e '
            const fs = require("node:fs");
            const cache = JSON.parse(fs.readFileSync("data-arome/arome-cache.json", "utf8"));
            const expectedSteps = 51;
            const minimumSteps = 1;
            const stepCount = Array.isArray(cache?.previsions)
              ? cache.previsions.length
              : 0;
            if (!cache?.modele || !cache.zone || stepCount < minimumSteps) {
              console.error(
                `Refusing to publish empty or invalid AROME cache: ${stepCount}/${expectedSteps} forecast steps.`
              );
              process.exit(1);
            }
            const message = `Publishing ${stepCount}/${expectedSteps} forecast steps for model ${cache.modele}.`;
            if (stepCount < expectedSteps) {
              console.warn(
                `${message} The next refresh will resume missing forecast steps.`
              );
            } else {
              console.log(message);
            }
          '

      - name: Publish AROME data branch
        run: bash .github/scripts/publish-data-branch.sh arome-data data-arome

