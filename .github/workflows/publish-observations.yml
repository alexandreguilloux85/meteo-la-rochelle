name: Publish weather observations

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site
          cp -R public/. site/

      - name: Download current AROME cache
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 60 \
            "https://alexandreguilloux85.github.io/meteo-la-rochelle/arome-cache.json" \
            --output site/arome-cache.json
          node -e '
            const fs = require("node:fs");
            const cache = JSON.parse(fs.readFileSync("site/arome-cache.json", "utf8"));
            if (!cache?.modele || !cache?.zone || !Array.isArray(cache.previsions) || cache.previsions.length === 0) {
              console.error("Le cache AROME publié est absent ou invalide.");
              process.exit(1);
            }
          '

      - name: Download latest Météo-France observations
        env:
          METEO_API_KEY: ${{ secrets.METEO_API_KEY }}
        run: |
          if [ -z "$METEO_API_KEY" ]; then
            echo "Configure the METEO_API_KEY repository secret."
            exit 1
          fi

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 60 \
            --get \
            --header "apikey: $METEO_API_KEY" \
            --header "accept: */*" \
            --data-urlencode "id_station=17300009" \
            --data-urlencode "format=json" \
            "https://public-api.meteofrance.fr/public/DPPaquetObs/v2/paquet/infrahoraire-6m" \
            --output site/observations.json

          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("site/observations.json", "utf8"));
            const rows = Array.isArray(data) ? data : data.features || data.data || [];
            if (!Array.isArray(rows) || rows.length === 0) {
              console.error("La réponse Météo-France ne contient aucune observation.");
              process.exit(1);
            }
            console.log("Observations récupérées :", rows.length);
          '

      - name: Préserver les tuiles radar XYZ déjà publiées
        run: |
          mkdir -p site/radar-xyz
          if curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --max-time 120 \
            "https://alexandreguilloux85.github.io/meteo-la-rochelle/radar-xyz/tiles.zip" \
            --output /tmp/radar-xyz-tiles.zip; then
            unzip -q /tmp/radar-xyz-tiles.zip -d site/radar-xyz
          else
            echo "Aucun jeu de tuiles radar précédent à préserver."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
