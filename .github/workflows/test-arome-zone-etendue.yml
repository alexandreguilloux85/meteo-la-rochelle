name: Test AROME zone étendue - paquets GRIB2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-paquets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Charger le code de Test_fonction
        uses: actions/checkout@v4
        with:
          ref: Test_fonction

      - name: Installer ecCodes pour décoder les paquets GRIB2 CCSDS
        run: |
          python -m pip install numpy eccodes

      - name: Télécharger un paquet AROME SP1 0.025 et extraire le vent
        env:
          METEO_AROME_PAQUETS_APPLICATION_ID: ${{ secrets.METEO_AROME_PAQUETS_APPLICATION_ID }}
          METEO_AROME_PAQUETS_TOKEN: ${{ secrets.METEO_AROME_PAQUETS_TOKEN }}
          METEO_AROME_PAQUETS_API_KEY: ${{ secrets.METEO_AROME_PAQUETS_API_KEY }}
          METEO_AROME_API_KEY: ${{ secrets.METEO_AROME_API_KEY }}
          AROME_BBOX: 43.2,48.3,-5.0,-0.3
        run: python .github/scripts/arome_paquets_test.py

      - name: Vérifier le JSON compatible navigateur
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("arome-paquets-test/arome-cache-paquets-test.json")
          cache = json.loads(p.read_text(encoding="utf-8"))
          assert cache["modele"] and cache["zone"]
          assert len(cache["previsions"]) == 6
          for e in cache["previsions"]:
              assert e["U"]["grille"] == e["V"]["grille"]
              assert len(e["U"]["valeurs"]) == e["U"]["grille"]["Ni"] * e["U"]["grille"]["Nj"]
          print("Format compatible : 6 échéances. JSON : ", round(p.stat().st_size/1048576, 2), "Mo")
          PY

      - name: Conserver le résultat de test sans publier sur le site
        uses: actions/upload-artifact@v4
        with:
          name: arome-paquets-grib2-test
          path: arome-paquets-test/arome-cache-paquets-test.json
          retention-days: 5
          compression-level: 6
          if-no-files-found: error
